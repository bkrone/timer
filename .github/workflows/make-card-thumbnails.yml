name: Make card thumbnails

# Whenever a workout card is added or changed, make a small preview copy in
# cards/thumbs/. The app uses these for the card picker, which is much lighter
# on a slow TV than decoding every full-size card. If a thumbnail is missing,
# the app just falls back to the full card, so nothing breaks.
#
# To build thumbnails for all your existing cards the first time, open the
# Actions tab, choose "Make card thumbnails", and click "Run workflow".

on:
  push:
    branches: [main]
    paths:
      - "cards/*.png"
      - "cards/*.jpg"
      - "cards/*.jpeg"
      - "cards/*.webp"
      - "cards/*.gif"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-thumbnails
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build thumbnails
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageOps

          SRC = "cards"
          OUT = os.path.join(SRC, "thumbs")
          WIDTH = 480
          EXTS = (".png", ".jpg", ".jpeg", ".webp", ".gif")

          os.makedirs(OUT, exist_ok=True)
          wanted = set()
          for name in sorted(os.listdir(SRC)):
              path = os.path.join(SRC, name)
              stem, ext = os.path.splitext(name)
              if not os.path.isfile(path) or ext.lower() not in EXTS:
                  continue
              wanted.add(stem + ".jpg")
              im = ImageOps.exif_transpose(Image.open(path))
              if im.mode in ("RGBA", "LA", "P"):
                  im = im.convert("RGBA")
                  flat = Image.new("RGB", im.size, (255, 255, 255))
                  flat.paste(im, mask=im.split()[-1])
                  im = flat
              else:
                  im = im.convert("RGB")
              if im.width > WIDTH:
                  im = im.resize((WIDTH, round(im.height * WIDTH / im.width)), Image.LANCZOS)
              im.save(os.path.join(OUT, stem + ".jpg"), "JPEG", quality=72, optimize=True, progressive=True)
              print("thumb:", name)

          # remove thumbnails whose card no longer exists
          for name in os.listdir(OUT):
              if name.endswith(".jpg") and name not in wanted:
                  os.remove(os.path.join(OUT, name))
                  print("removed:", name)
          PY

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/thumbs
          if git diff --cached --quiet; then
            echo "Thumbnails already up to date."
          else
            git commit -m "Update card thumbnails [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Notify new workout card

on:
  push:
    branches: [main]
    paths:
      - "cards/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Figure out which cards changed
        id: cards
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git show --name-only --diff-filter=AM --pretty="" HEAD -- 'cards/*.png' 'cards/*.jpg' 'cards/*.jpeg' 'cards/*.webp' 'cards/*.gif' 'cards/*.avif' || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'cards/*.png' 'cards/*.jpg' 'cards/*.jpeg' 'cards/*.webp' 'cards/*.gif' 'cards/*.avif' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "names=New workout cards" >> "$GITHUB_OUTPUT"
          else
            NAMES=$(echo "$FILES" \
              | xargs -n1 basename \
              | sed -E 's/\.[^.]+$//' \
              | sed -E 's/[-_]+/ /g' \
              | sed -E 's/(^|[[:space:]])([a-z])/\1\U\2/g' \
              | paste -sd ', ' -)
            echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          fi

      - name: Send OneSignal push notification
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.onesignal.com/notifications" \
            -H "Authorization: Key ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"496e1f04-bb14-4bc5-9889-9a421c0c2905\",\"included_segments\":[\"All Push\"],\"target_channel\":\"push\",\"headings\":{\"en\":\"New workout card added\"},\"contents\":{\"en\":\"${{ steps.cards.outputs.names }} — tap Refresh on the card picker screen to see it.\"}}")

          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "OneSignal HTTP status: $STATUS"
          echo "OneSignal response body: $BODY"

          # Surface the real outcome instead of a meaningless green checkmark:
          # fail the job if the HTTP call itself failed, if OneSignal reported
          # errors, or if it accepted the request but found nobody to send to.
          if [ "$STATUS" -ge 300 ]; then
            echo "::error::OneSignal returned HTTP $STATUS — see response body above."
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors"'; then
            echo "::error::OneSignal reported errors — see response body above."
            exit 1
          fi
          # Per OneSignal's own docs: "If the message id is set, then a
          # message was sent." The recipients field is optional and often
          # just isn't included — it is NOT a reliable signal of failure.
          MSG_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$MSG_ID" ]; then
            echo "::error::OneSignal did not return a message id — see response body above."
            exit 1
          fi
          echo "Notification sent — id $MSG_ID"

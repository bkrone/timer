name: Notify new workout card

on:
  push:
    branches: [main]
    paths:
      - "cards/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Figure out which cards changed
        id: cards
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git show --name-only --diff-filter=AM --pretty="" HEAD -- 'cards/*.png' 'cards/*.jpg' 'cards/*.jpeg' 'cards/*.webp' 'cards/*.gif' 'cards/*.avif' || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'cards/*.png' 'cards/*.jpg' 'cards/*.jpeg' 'cards/*.webp' 'cards/*.gif' 'cards/*.avif' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "names=New workout cards" >> "$GITHUB_OUTPUT"
          else
            NAMES=$(echo "$FILES" \
              | xargs -n1 basename \
              | sed -E 's/\.[^.]+$//' \
              | sed -E 's/[-_]+/ /g' \
              | sed -E 's/(^|[[:space:]])([a-z])/\1\U\2/g' \
              | paste -sd ', ' -)
            echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          fi

      - name: Send OneSignal push notification
        env:
          # Add one subscription ID per subscriber here (Audience > Subscriptions
          # in OneSignal, click a device, copy its Subscription ID). This
          # targets people directly instead of relying on OneSignal's
          # "Subscribed Users" segment, which has a known sync-lag bug that
          # can report real subscribers as unsubscribed at send time.
          SUBSCRIPTION_IDS: >-
            ["1974f34b-952d-4753-bdcf-c39f405e5bb9","6b3ce17c-2c3c-46ec-bd78-ce44d069d10a"]
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.onesignal.com/notifications" \
            -H "Authorization: Key ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"496e1f04-bb14-4bc5-9889-9a421c0c2905\",\"include_subscription_ids\":${SUBSCRIPTION_IDS},\"headings\":{\"en\":\"New workout card added\"},\"contents\":{\"en\":\"${{ steps.cards.outputs.names }}\"}}")

          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "OneSignal HTTP status: $STATUS"
          echo "OneSignal response body: $BODY"

          # Surface the real outcome instead of a meaningless green checkmark:
          # fail the job if the HTTP call itself failed, if OneSignal reported
          # errors, or if it accepted the request but found nobody to send to.
          if [ "$STATUS" -ge 300 ]; then
            echo "::error::OneSignal returned HTTP $STATUS — see response body above."
            exit 1
          fi
          if echo "$BODY" | grep -q '"errors"'; then
            echo "::error::OneSignal reported errors — see response body above."
            exit 1
          fi
          RECIPIENTS=$(echo "$BODY" | grep -o '"recipients":[0-9]*' | cut -d: -f2)
          if [ -z "$RECIPIENTS" ] || [ "$RECIPIENTS" = "0" ]; then
            echo "::error::OneSignal accepted the request but found 0 recipients — check Audience > Subscriptions in the OneSignal dashboard."
            exit 1
          fi
          echo "Sent to $RECIPIENTS recipient(s)."

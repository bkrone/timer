<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Bell — Workout Timer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bell">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
  :root{
    --bg:#000000;
    --panel:#0a0a0a;
    --line:#242424;
    --fg:#F5F2ED;
    --muted:#7a7a7a;
    --accent:#FF5A1F;
    --accent-dim:#7a2c10;
    --work:#35D07F;
    --work-dim:#123a26;
    --rest:#E23D28;
    --rest-dim:#3a1410;
    --radius:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    height:100vh;
    height:100dvh;
    user-select:none;
    -webkit-user-select:none;
  }
  button{
    font-family:inherit;
    color:inherit;
    background:none;
    border:none;
    cursor:pointer;
  }
  button:focus, input:focus{
    outline:none;
  }
  /* Our own cursor highlight. Tizen ignores outline in places, so this uses
     border + background + box-shadow, which render reliably everywhere. */
  .nav-focus{
    border-color:var(--accent) !important;
    background:#2a1408 !important;
    box-shadow:0 0 0 4px var(--accent), 0 0 22px rgba(255,90,31,.55) !important;
    color:var(--fg) !important;
    position:relative;
    z-index:2;
  }
  .primary-btn.nav-focus{
    background:#ff7a45 !important;
    color:#000 !important;
  }
  .ctrl-btn.main.nav-focus{
    background:var(--accent) !important;
    color:#000 !important;
  }
  .navbtn.nav-focus{
    background:#2a1408 !important;
    border-radius:var(--radius);
  }
  input.nav-focus{
    background:#2a1408 !important;
  }
  input[type="number"]{
    font-family:inherit;
    background:var(--panel);
    color:var(--fg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:.6em .5em;
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
  }

  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:900px;
    margin:0 auto;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }
  .screen{
    display:none;
    flex-direction:column;
    height:100%;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));
    overflow-y:auto;
  }
  .screen.active{display:flex;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:44px;
    flex:0 0 auto;
  }
  .brand{
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:.01em;
  }
  .brand .dot{color:var(--accent);}
  .navbtn{
    font-size:.95rem;
    color:var(--muted);
    padding:.5em .3em;
    display:flex;
    align-items:center;
    gap:.3em;
  }
  .navbtn:active{color:var(--fg);}
  .navbtn svg{width:18px;height:18px;}

  /* ---------- select screen ---------- */
  .select-title{
    font-size:clamp(1.6rem,5vw,2.2rem);
    font-weight:700;
    margin:.6em 0 .5em;
    letter-spacing:-.01em;
  }
  .card-select-bar{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:1.1em;
    text-align:left;
  }
  .card-select-bar:active, .card-select-bar.nav-focus{
    border-color:var(--accent);
  }
  .card-select-bar img{
    width:44px;
    height:44px;
    object-fit:cover;
    border-radius:var(--radius);
    background:#fff;
    flex:0 0 auto;
  }
  .csb-text{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    min-width:0;
  }
  .csb-kicker{
    color:var(--accent);
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.03em;
  }
  #card-select-label{
    font-size:1.05rem;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .csb-chev{
    font-size:1.6rem;
    color:var(--muted);
    flex:0 0 auto;
  }
  .select-sub{
    color:var(--muted);
    font-size:.95rem;
    margin-bottom:1.1em;
  }
  .type-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    flex:1 1 auto;
  }
  @media (min-width:640px){
    .type-grid{grid-template-columns:repeat(3,1fr);}
  }
  .type-card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px;
    text-align:left;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:136px;
    transition:border-color .15s, background .15s;
  }
  .type-card:active{background:var(--panel); border-color:var(--accent);}
  .type-card .name{
    font-size:1.15rem;
    font-weight:700;
  }
  .type-card .desc{
    color:var(--muted);
    font-size:.82rem;
    margin-top:6px;
    line-height:1.3;
  }

  /* ---------- config screen ---------- */
  .config-header{
    margin:1.2em 0 1.4em;
  }
  .config-header .kicker{
    color:var(--accent);
    font-size:.85rem;
    font-weight:700;
  }
  .config-header h2{
    font-size:clamp(1.5rem,4.5vw,2rem);
    margin:.15em 0 0;
  }
  .field-group{
    margin-bottom:1.6em;
  }
  .field-label{
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:.6em;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
  }
  .chip{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:.75em 1.2em;
    font-size:.95rem;
    font-variant-numeric:tabular-nums;
  }
  .chip.selected{
    border-color:var(--accent);
    color:var(--accent);
  }
  .stepper{
    display:inline-flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .stepper-btn{
    width:52px;
    height:52px;
    min-width:52px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:800;
    line-height:1;
    background:var(--panel);
    color:var(--fg);
    border:none;
    border-radius:0;
  }
  .stepper-btn:active, .stepper-btn.nav-focus{
    background:var(--accent) !important;
    color:#000 !important;
  }
  .stepper input[type="number"]{
    width:3.6em;
    text-align:center;
    border:none;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-radius:0;
    padding:.6em .2em;
    background:var(--bg);
    font-size:1rem;
  }
  .stepper-unit{
    color:var(--muted);
    font-size:.85rem;
    padding:0 .9em 0 .6em;
    background:var(--panel);
    align-self:stretch;
    display:flex;
    align-items:center;
  }
  .custom-inline.selected{border-color:var(--accent);}
  .toggle-row{
    display:flex;
    gap:8px;
  }
  .toggle-row .chip{flex:1; text-align:center;}
  .config-footer{
    margin-top:auto;
    padding-top:1em;
  }
  .primary-btn{
    width:100%;
    background:var(--accent);
    color:#000;
    font-weight:700;
    font-size:1.05rem;
    padding:.95em;
    border-radius:var(--radius);
    text-align:center;
  }
  .primary-btn:active{background:#e04f18;}
  .primary-btn[disabled]{
    background:var(--line);
    color:var(--muted);
  }

  /* ---------- run screen ---------- */
  #screen-run{
    padding-left:16px;
    padding-right:16px;
    justify-content:space-between;
    transition:background-color .4s ease;
  }
  #screen-run.phase-work{background:linear-gradient(var(--work-dim),#000 55%);}
  #screen-run.phase-rest{background:linear-gradient(var(--rest-dim),#000 55%);}

  .run-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .run-meta{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .phase-label{
    font-size:clamp(1rem,3.4vw,1.6rem);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:.2em;
    min-height:1.4em;
  }
  .phase-label.work{color:var(--work);}
  .phase-label.rest{color:var(--rest);}
  .phase-label.neutral{color:var(--accent);}
  .round-label{
    color:var(--muted);
    font-size:clamp(.85rem,2.2vw,1.05rem);
    margin-bottom:.3em;
    min-height:1.3em;
  }
  .time-display{
    font-size:clamp(4.2rem,26vw,13rem);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
    line-height:1;
  }
  .cap-flag{
    color:var(--rest);
    font-weight:700;
    font-size:clamp(1rem,3vw,1.4rem);
    margin-top:.3em;
    visibility:hidden;
  }
  .cap-flag.show{visibility:visible;}
  .progress-track{
    width:100%;
    max-width:520px;
    height:4px;
    background:var(--line);
    border-radius:2px;
    margin-top:1em;
    overflow:hidden;
    visibility:hidden;
  }
  .progress-track.show{visibility:visible;}
  .progress-fill{
    height:100%;
    background:var(--fg);
    width:0%;
    transition:width .2s linear, background-color .3s;
  }

  .run-controls{
    flex:0 0 auto;
    display:flex;
    gap:20px;
    padding:1em 0 .4em;
  }
  .ctrl-btn{
    flex:1;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.25em 1em;
    font-size:1rem;
    font-weight:700;
    text-align:center;
  }
  .ctrl-btn.main{
    background:var(--fg);
    color:#000;
    border-color:var(--fg);
  }
  .ctrl-btn.main.running{
    background:transparent;
    color:var(--fg);
    border-color:var(--fg);
  }
  .ctrl-btn:active{opacity:.7;}
  .ctrl-btn.bottom-exit{
    width:100%;
    margin-top:12px;
    padding:.9em 1em;
    color:var(--muted);
    border-color:var(--line);
    font-weight:700;
  }
  .ctrl-btn.bottom-exit:active, .ctrl-btn.bottom-exit.nav-focus{
    color:var(--fg);
  }

  /* ---------- card panel + split layout ---------- */
  .run-body{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .timer-col{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:0;
    min-width:0;
  }
  .card-panel{
    display:none;
    align-items:center;
    justify-content:center;
    min-height:0;
    min-width:0;
    overflow:hidden;
  }
  .card-panel img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:var(--radius);
    background:#fff;
  }
  /* Split side-by-side once there's room (TV / iPad landscape) */
  body.split #app{max-width:1600px;}
  @media (min-width:820px){
    body.split .run-body{flex-direction:row; gap:18px;}
    body.split .card-panel{display:flex; flex:1 1 46%;}
    body.split .timer-col{flex:1 1 54%;}
  }
  /* Narrow screens: card stacks above, smaller, toggled on */
  @media (max-width:819px){
    body.split.card-open .card-panel{display:flex; flex:0 0 34%; margin-bottom:10px;}
  }
  body:not(.split) #btn-card-view{visibility:hidden;}
  /* Plank never shows a card, regardless of what's selected */
  body.force-full .card-panel{display:none !important;}
  body.force-full .timer-col{flex:1 1 100% !important;}

  .cardonly-wrap{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .cardonly-wrap img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:var(--radius);
    background:#fff;
  }
  .cardonly-empty{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2em;
    color:var(--muted);
    font-size:1.05rem;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    flex:1 1 auto;
    align-content:start;
  }
  @media (min-width:640px){
    .card-grid{grid-template-columns:repeat(4,1fr);}
  }
  .card-choice{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:stretch;
  }
  .card-choice.selected{border-color:var(--accent);}
  .card-choice img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    background:#fff;
    border-radius:var(--radius);
  }
  .card-choice .cname{
    font-size:.8rem;
    color:var(--muted);
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card-choice.none-option{
    align-items:center;
    justify-content:center;
    min-height:120px;
    font-weight:700;
  }
  .cards-msg{
    color:var(--muted);
    font-size:.9rem;
    line-height:1.5;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .cards-msg code{
    color:var(--fg);
    background:var(--panel);
    padding:.1em .35em;
    border-radius:2px;
  }

  /* Expand the real clickable area beyond each button's visible edges.
     A drifting TV pointer that "misses" by a few pixels should still hit
     something real — this keeps native clicks landing on actual buttons
     instead of empty space, which is what confuses the TV's own cursor. */
  .type-card, .card-choice, .chip, .ctrl-btn, .primary-btn, .navbtn, .card-select-bar{
    position:relative;
    cursor:pointer;
  }
  .type-card::after, .card-choice::after, .chip::after,
  .ctrl-btn::after, .primary-btn::after, .navbtn::after, .card-select-bar::after{
    content:"";
    position:absolute;
    inset:-8px;
  }
  /* Stepper buttons sit flush against their neighbors, so only expand the
     hit area vertically — expanding sideways would steal clicks meant for
     the input or the button right next to it. */
  .stepper-btn{
    position:relative;
    cursor:pointer;
  }
  .stepper-btn::after{
    content:"";
    position:absolute;
    top:-10px;
    bottom:-10px;
    left:0;
    right:0;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== SELECT SCREEN ===================== -->
  <section class="screen active" id="screen-select">
    <div class="topbar">
      <div class="brand">first due fitness<span class="dot"></span></div>
    </div>
    <div class="select-title">What are we running?</div>

    <button class="card-select-bar" id="btn-pick-card">
      <img id="card-select-thumb" alt="" style="display:none;">
      <span class="csb-text">
        <span class="csb-kicker">Workout card</span>
        <span id="card-select-label">Choose a card</span>
      </span>
      <span class="csb-chev" aria-hidden="true">&rsaquo;</span>
    </button>

    <div class="select-sub">Pick a timer type to configure it.</div>
    <div class="type-grid" id="type-grid"></div>
  </section>

  <!-- ===================== CARD PICKER SCREEN ===================== -->
  <section class="screen" id="screen-cards">
    <div class="topbar">
      <button class="navbtn" id="btn-cards-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <button class="navbtn" id="btn-cards-refresh">Refresh</button>
    </div>
    <div class="select-title">Workout card</div>
    <div class="select-sub" id="cards-sub">Shown beside the timer on screen.</div>
    <div class="card-grid" id="card-grid"></div>
  </section>

  <!-- ===================== CARD ONLY SCREEN ===================== -->
  <section class="screen" id="screen-cardonly">
    <div class="run-top">
      <button class="navbtn exit" id="btn-cardonly-exit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Exit
      </button>
      <button class="navbtn" id="btn-cardonly-change">Change</button>
    </div>
    <div class="cardonly-wrap" id="cardonly-wrap">
      <img id="cardonly-img" alt="Workout card">
    </div>
    <div class="cardonly-empty" id="cardonly-empty" style="display:none;">
      <p>No card selected yet.</p>
      <button class="primary-btn" id="btn-cardonly-pick">Choose a card</button>
    </div>
  </section>

  <!-- ===================== CONFIG SCREEN ===================== -->
  <section class="screen" id="screen-config">
    <div class="topbar">
      <button class="navbtn" id="btn-back-to-select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
    </div>
    <div class="config-header">
      <div class="kicker" id="config-kicker">SET UP</div>
      <h2 id="config-title">Type</h2>
    </div>
    <div id="config-fields"></div>
    <div class="config-footer">
      <button class="primary-btn" id="btn-start">Start</button>
    </div>
  </section>

  <!-- ===================== RUN SCREEN ===================== -->
  <section class="screen" id="screen-run">
    <div class="run-top">
      <button class="navbtn exit" id="btn-exit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Exit
      </button>
      <button class="navbtn" id="btn-card-view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>
        <span id="card-view-label">Card</span>
      </button>
    </div>

    <div class="run-body" id="run-body">
      <div class="card-panel" id="card-panel">
        <img id="card-img" alt="Workout card">
      </div>

      <div class="timer-col">
        <div class="run-meta">
          <div class="round-label" id="round-label">&nbsp;</div>
          <div class="phase-label neutral" id="phase-label">READY</div>
          <div class="time-display" id="time-display">00:00</div>
          <div class="cap-flag" id="cap-flag">TIME CAP</div>
          <div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <div class="run-controls">
          <button class="ctrl-btn secondary" id="btn-reset">Reset</button>
          <button class="ctrl-btn main" id="btn-toggle">Start</button>
          <button class="ctrl-btn secondary" id="btn-finish" style="display:none;">Finish</button>
        </div>
        <button class="ctrl-btn bottom-exit" id="btn-exit-bottom">Exit</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ===================== CONSTANTS ===================== */
  var TYPES = [
    { id:"amrap", name:"AMRAP", desc:"As many rounds as possible. Counts down." },
    { id:"emom", name:"EMOM", desc:"Every minute on the minute. Ticks at each interval." },
    { id:"interval", name:"Interval", desc:"Work / rest rounds — Tabata presets or your own." },
    { id:"fortime", name:"For time", desc:"Counts up, optional time cap." },
    { id:"plank", name:"Plank", desc:"3 minute ladder: hands, elbows, hands, elbows." }
  ];
  var PHASED_TYPES = ["emom","interval","plank"];
  var PRESTART_SECONDS = 10;

  var store = (function(){
    try{
      var t = "__bell_test__";
      window.localStorage.setItem(t,"1");
      window.localStorage.removeItem(t);
      return window.localStorage;
    }catch(e){ return null; }
  })();
  function saveCfg(type,cfg){
    if(!store) return;
    try{ store.setItem("bell_cfg_"+type, JSON.stringify(cfg)); }catch(e){}
  }
  function loadCfg(type){
    if(!store) return null;
    try{ var v = store.getItem("bell_cfg_"+type); return v?JSON.parse(v):null; }catch(e){ return null; }
  }

  /* ===================== AUDIO ===================== */
  var actx = null;
  function ctx(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
    }
    if(actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq,dur,vol,delay,type){
    try{
      var c = ctx();
      var t0 = c.currentTime + (delay||0);
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq,t0);
      gain.gain.setValueAtTime(0,t0);
      gain.gain.linearRampToValueAtTime(vol||0.35,t0+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0+dur+0.02);
    }catch(e){}
  }
  var Sound = {
    tick: function(){ tone(1500,0.06,0.25,0,"square"); },
    countBeep: function(){ tone(880,0.12,0.35,0,"sine"); },
    workStart: function(){ tone(1046,0.22,0.4,0,"sine"); },
    restStart: function(){ tone(523,0.22,0.4,0,"sine"); },
    horn: function(){
      tone(220,0.5,0.5,0,"sawtooth");
      tone(220,0.5,0.5,0.55,"sawtooth");
    },
    capHit: function(){

      tone(440,0.3,0.4,0.18);
    }
  };

  function fmt(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var h = Math.floor(totalSeconds/3600);
    var m = Math.floor((totalSeconds%3600)/60);
    var s = totalSeconds%60;
    if(h>0) return h+":"+pad(m)+":"+pad(s);
    return pad(m)+":"+pad(s);
  }

  /* ===================== CONFIG SCREEN BUILDERS ===================== */
  function makeStepper(step, min, max, initialValue, unitLabel, extraClass){
    step = step || 1;
    var wrap = document.createElement("div");
    wrap.className = "stepper" + (extraClass ? " " + extraClass : "");
    var minus = document.createElement("button");
    minus.type = "button"; minus.className = "stepper-btn"; minus.textContent = "\u2212";
    minus.setAttribute("aria-label", "Decrease");
    var input = document.createElement("input");
    input.type = "number";
    input.inputMode = "decimal";
    if(typeof min === "number") input.min = String(min);
    if(typeof max === "number") input.max = String(max);
    input.step = step;
    input.value = initialValue;
    var plus = document.createElement("button");
    plus.type = "button"; plus.className = "stepper-btn"; plus.textContent = "+";
    plus.setAttribute("aria-label", "Increase");

    function clamp(v){
      if(typeof min === "number") v = Math.max(min, v);
      if(typeof max === "number") v = Math.min(max, v);
      return v;
    }
    function bump(delta){
      var cur = parseFloat(input.value);
      if(isNaN(cur)) cur = 0;
      input.value = clamp(cur + delta);
      input.dispatchEvent(new Event("input", { bubbles:true }));
    }
    minus.addEventListener("click", function(){ bump(-step); });
    plus.addEventListener("click", function(){ bump(step); });

    wrap.appendChild(minus);
    wrap.appendChild(input);
    wrap.appendChild(plus);
    if(unitLabel){
      var span = document.createElement("span");
      span.className = "stepper-unit";
      span.textContent = unitLabel;
      wrap.appendChild(span);
    }
    return { wrap: wrap, input: input };
  }

  function chipRow(container, options, unit, selectedValue, onSelect, allowCustom, customDefault, customStep){
    var row = document.createElement("div");
    row.className = "chip-row";
    var selected = { value: selectedValue, custom:false };

    function markSelection(val, isCustom){
      row.querySelectorAll(".chip").forEach(function(c){
        c.classList.toggle("selected", !isCustom && parseFloat(c.dataset.val)===val);
      });
      var ci = row.querySelector(".custom-inline");
      if(ci) ci.classList.toggle("selected", isCustom);
    }

    options.forEach(function(opt){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.dataset.val = opt.value;
      chip.textContent = opt.label;
      if(opt.value === selectedValue) chip.classList.add("selected");
      chip.addEventListener("click", function(){
        selected.value = opt.value; selected.custom = false;
        markSelection(opt.value,false);
        onSelect(opt.value);
      });
      row.appendChild(chip);
    });

    if(allowCustom){
      var isPreset = options.some(function(o){ return o.value === selectedValue; });
      var initVal = isPreset ? customDefault : selectedValue;
      var st = makeStepper(customStep || 1, 0, null, initVal, unit, "custom-inline");
      var wrap = st.wrap, input = st.input;
      if(!isPreset) wrap.classList.add("selected");
      input.addEventListener("focus", function(){ markSelection(parseFloat(input.value),true); });
      input.addEventListener("input", function(){
        var v = parseFloat(input.value);
        if(!isNaN(v) && v>=0){ selected.value = v; selected.custom = true; markSelection(v,true); onSelect(v); }
      });
      row.appendChild(wrap);
    }
    container.appendChild(row);
    return selected;
  }

  /* ===================== BUILD PHASES ===================== */
  function buildPhases(type, cfg){
    var out = [];
    if(type === "emom"){
      var totalSec = cfg.totalMin*60;
      var intervalSec = cfg.intervalMin*60;
      var n = Math.max(1, Math.round(totalSec/intervalSec));
      for(var i=0;i<n;i++) out.push({label:"MINUTE "+(i+1)+" / "+n, duration:intervalSec, kind:"emom"});
    } else if(type === "interval"){
      for(var r=0;r<cfg.rounds;r++){
        out.push({label:"WORK", duration:cfg.work, kind:"work", round:r+1});
        if(cfg.rest>0 && r < cfg.rounds-1) out.push({label:"REST", duration:cfg.rest, kind:"rest", round:r+1});
      }
    } else if(type === "plank"){
      out.push({label:"HANDS", duration:60, kind:"work"});
      out.push({label:"ELBOWS", duration:60, kind:"rest"});
      out.push({label:"HANDS", duration:30, kind:"work"});
      out.push({label:"ELBOWS", duration:30, kind:"rest"});
    }
    return out;
  }

  /* ===================== SETUP / RUN ===================== */
  function setupRun(type, cfg){
    running = false; paused = false; pausedAccum = 0; lastPhaseIdx = -1; lastWholeSecond = -1;
    capFired = false; finished = false; finalElapsed = 0;
    el("btn-finish").style.display = "none";
    el("btn-reset").style.display = "";
    el("cap-flag").classList.remove("show");
    el("screen-run").classList.remove("phase-work","phase-rest");

    // Plank is always a full-width timer — no card display, even
    // if a card happens to be selected for other workouts.
    var noCard = (type === "plank");
    document.body.classList.toggle("force-full", noCard);
    el("btn-card-view").style.display = noCard ? "none" : "";

    if(PHASED_TYPES.indexOf(type) !== -1){
      phases = buildPhases(type, cfg);
    } else {
      phases = [];
    }

    if(type==="amrap"){
      capSeconds = cfg.minutes*60;
    } else if(type==="fortime" && cfg.hasCap){
      capSeconds = cfg.capMin*60;
    } else {
      capSeconds = 0;
    }

    if(type==="fortime"){
      el("btn-finish").style.display = "";
    }

    el("progress-track").classList.toggle("show", type==="amrap" || PHASED_TYPES.indexOf(type)!==-1 || (type==="fortime" && cfg.hasCap));

    el("btn-toggle").textContent = "Start";
    el("btn-toggle").classList.remove("running");
    el("phase-label").textContent = "READY";
    el("phase-label").className = "phase-label neutral";
    el("round-label").innerHTML = "&nbsp;";
    if(type==="amrap"){
      el("time-display").textContent = fmt(capSeconds);
    } else if(phases.length){
      el("time-display").textContent = fmt(phases[0].duration);
    } else {
      el("time-display").textContent = "00:00";
    }
    el("progress-fill").style.width = "0%";
    el("progress-fill").style.background = "var(--fg)";
  }

  el("btn-toggle").addEventListener("click", function(){
    if(finished || preStarting) return;
    if(!running){ startPreCountdown(); } else if(!paused){ pauseRun(); } else { resumeRun(); }
  });
  el("btn-reset").addEventListener("click", function(){
    if(preStartTimer){ clearInterval(preStartTimer); preStartTimer=null; preStarting=false; }
    setupRun(currentType, currentConfig);
  });
  el("btn-finish").addEventListener("click", function(){
    if(!running) return;
    finalElapsed = getElapsed();
    finished = true;
    running = false;

    releaseWake();
    el("phase-label").textContent = "FINISHED";
    el("phase-label").className = "phase-label neutral";
    el("time-display").textContent = fmt(finalElapsed);
    el("btn-toggle").textContent = "Done";
    el("btn-finish").style.display = "none";
  });

  function getElapsed(){
    if(paused) return (pausedAt - startTime - pausedAccum)/1000;
    return (Date.now() - startTime - pausedAccum)/1000;
  }

  function startPreCountdown(){
    preStarting = true;
    var n = PRESTART_SECONDS;
    el("phase-label").textContent = "GET READY";
    el("phase-label").className = "phase-label neutral";
    el("round-label").innerHTML = "&nbsp;";
    el("time-display").textContent = String(n);
    el("btn-toggle").textContent = "...";
    Sound.tick();
    preStartTimer = setInterval(function(){
      n--;
      if(n > 0){
        el("time-display").textContent = String(n);
        if(n<=3) Sound.countBeep(); else Sound.tick();
      } else {
        clearInterval(preStartTimer);
        preStartTimer = null;
        preStarting = false;
        Sound.workStart();
        startRun();
      }
    }, 1000);
  }

  function startRun(){
    running = true; paused = false;
    startTime = Date.now();
    pausedAccum = 0;
    requestWake();
    el("btn-toggle").textContent = "Pause";
    el("btn-toggle").classList.add("running");
    tick();
  }
  function pauseRun(){
    paused = true;
    pausedAt = Date.now();
    el("btn-toggle").textContent = "Resume";
    if(rafId) cancelAnimationFrame(rafId);
    releaseWake();
  }
  function resumeRun(){
    pausedAccum += Date.now() - pausedAt;
    paused = false;
    el("btn-toggle").textContent = "Pause";
    requestWake();
    tick();
  }
  function stopRun(){
    running = false; paused = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(preStartTimer){ clearInterval(preStartTimer); preStartTimer = null; }
    preStarting = false;
    releaseWake();
  }

  /* ===================== MAIN TICK ===================== */
  function tick(){
    if(!running || paused){ return; }
    var elapsed = getElapsed();
    var wholeSec = Math.floor(elapsed);

    if(currentType === "amrap"){
      var remaining = capSeconds - elapsed;
      el("phase-label").textContent = "WORK";
      el("phase-label").className = "phase-label neutral";
      el("time-display").textContent = fmt(Math.max(0,remaining));
      el("progress-fill").style.width = Math.min(100, (elapsed/capSeconds)*100)+"%";
      if(wholeSec !== lastWholeSecond){
        var rem = Math.ceil(remaining);
        if(rem<=3 && rem>0) Sound.countBeep();
        if(rem<=0 && !capFired){ Sound.horn(); capFired = true; }
      }
      if(remaining<=0){
        el("time-display").textContent = "00:00";
        finishNoInput();
        return;
      }
    }

    else if(currentType === "fortime"){
      el("phase-label").textContent = "WORK";
      el("phase-label").className = "phase-label neutral";
      el("time-display").textContent = fmt(elapsed);
      if(capSeconds>0){
        el("progress-fill").style.width = Math.min(100, (elapsed/capSeconds)*100)+"%";
        if(elapsed>=capSeconds && !capFired){
          capFired = true;
          Sound.capHit();
          el("cap-flag").classList.add("show");
        }
      }
    }

    else if(PHASED_TYPES.indexOf(currentType) !== -1){
      var idx = 0, acc = 0;
      for(idx=0; idx<phases.length; idx++){
        if(elapsed < acc + phases[idx].duration) break;
        acc += phases[idx].duration;
      }
      if(idx >= phases.length){
        // completed
        el("time-display").textContent = "00:00";
        finishNoInput();
        return;
      }
      var ph = phases[idx];
      var into = elapsed - acc;
      var remainingInPhase = ph.duration - into;

      if(idx !== lastPhaseIdx){
        lastPhaseIdx = idx;
        el("screen-run").classList.remove("phase-work","phase-rest");
        if(ph.kind === "work"){
          Sound.workStart();
          el("screen-run").classList.add("phase-work");
          el("phase-label").className = "phase-label work";
        } else if(ph.kind === "rest"){
          Sound.restStart();
          el("screen-run").classList.add("phase-rest");
          el("phase-label").className = "phase-label rest";
        } else {
          Sound.tick(); setTimeout(Sound.tick,140); setTimeout(Sound.workStart,280);
          el("phase-label").className = "phase-label neutral";
        }
      }
      el("phase-label").textContent = ph.label;
      el("time-display").textContent = fmt(remainingInPhase);

      if(ph.round){
        el("round-label").textContent = "Round "+ph.round+" of "+cfgRounds();
      } else if(currentType==="emom"){
        el("round-label").innerHTML = "&nbsp;";
      }

      var totalDur = phases.reduce(function(s,p){ return s+p.duration; },0);
      el("progress-fill").style.width = Math.min(100,(elapsed/totalDur)*100)+"%";
      el("progress-fill").style.background = ph.kind==="rest" ? "var(--rest)" : (ph.kind==="work" ? "var(--work)" : "var(--fg)");

      if(wholeSec !== lastWholeSecond){
        var remCeil = Math.ceil(remainingInPhase);
        if(remCeil<=3 && remCeil>0 && ph.duration>4) Sound.tick();
      }
    }

    lastWholeSecond = wholeSec;
    rafId = requestAnimationFrame(tick);
  }

  function cfgRounds(){
    return currentConfig.rounds || 0;
  }

  function finishNoInput(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    releaseWake();
    el("phase-label").textContent = "DONE";
    el("phase-label").className = "phase-label neutral";
    el("btn-toggle").textContent = "Done";
    Sound.horn();
  }

  /* ===================== WORKOUT CARDS ===================== */
  // Images live in a "cards/" folder in the repo. The app finds them
  // automatically on GitHub Pages. If auto-discovery is unavailable,
  // list filenames here manually as a fallback.
  var MANUAL_CARDS = [
    // "murph.png", "chest-and-back.jpg"
  ];
  var CARDS_FOLDER = "cards";
  var IMG_RE = /\.(png|jpe?g|webp|gif|avif)$/i;

  var cardList = [];
  var selectedCard = null;

  function prettyName(filename){
    return filename
      .replace(IMG_RE, "")
      .replace(/[-_]+/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
  }

  function cardUrl(filename){
    var base = location.pathname.replace(/[^/]*$/, "");
    return base + CARDS_FOLDER + "/" + encodeURIComponent(filename);
  }

  function cachedCards(){
    if(!store) return null;
    try{ var v = store.getItem("bell_cards"); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }
  function cacheCards(list){
    if(!store) return;
    try{ store.setItem("bell_cards", JSON.stringify(list)); }catch(e){}
  }

  // Work out the GitHub repo from the Pages URL, e.g.
  // https://username.github.io/bell-timer/  ->  username / bell-timer
  function inferRepo(){
    var host = location.hostname;
    if(!/\.github\.io$/i.test(host)) return null;
    var user = host.replace(/\.github\.io$/i, "");
    var parts = location.pathname.split("/").filter(Boolean);
    var repo = parts.length ? parts[0] : (user + ".github.io");
    return { user:user, repo:repo };
  }

  function discoverCards(force, done){
    var cached = cachedCards();
    if(cached && cached.length && !force){
      cardList = cached;
      done(cardList, "cache");
      return;
    }
    var info = inferRepo();
    if(!info || typeof fetch !== "function"){
      cardList = MANUAL_CARDS.slice();
      done(cardList, cardList.length ? "manual" : "none");
      return;
    }
    var api = "https://api.github.com/repos/" + info.user + "/" + info.repo +
              "/contents/" + CARDS_FOLDER;
    fetch(api)
      .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(function(data){
        if(!Array.isArray(data)) throw new Error("bad payload");
        var files = data
          .filter(function(f){ return f.type === "file" && IMG_RE.test(f.name); })
          .map(function(f){ return f.name; })
          .sort(function(a,b){ return a.localeCompare(b); });
        cardList = files;
        cacheCards(files);
        done(cardList, "github");
      })
      .catch(function(){
        var fallback = cached && cached.length ? cached : MANUAL_CARDS.slice();
        cardList = fallback;
        done(cardList, fallback.length ? "fallback" : "none");
      });
  }

  function setSelectedCard(filename){
    selectedCard = filename || null;
    if(store){
      try{
        if(selectedCard) store.setItem("bell_selected_card", selectedCard);
        else store.removeItem("bell_selected_card");
      }catch(e){}
    }
    document.body.classList.toggle("split", !!selectedCard);
    el("card-select-label").textContent = selectedCard ? prettyName(selectedCard) : "Choose a card";
    var thumb = el("card-select-thumb");
    if(selectedCard){
      thumb.src = cardUrl(selectedCard);
      thumb.alt = prettyName(selectedCard);
      thumb.style.display = "";
      el("card-img").src = cardUrl(selectedCard);
      el("card-img").alt = prettyName(selectedCard);
    } else {
      thumb.removeAttribute("src");
      thumb.style.display = "none";
      el("card-img").removeAttribute("src");
      document.body.classList.remove("card-open");
    }
  }

  var cardPickerReturn = "screen-select";

  function finishCardPick(){
    show(cardPickerReturn);
    if(cardPickerReturn === "screen-cardonly") refreshCardOnlyView();
  }

  function renderCardGrid(list, source){
    var grid2 = el("card-grid");
    var sub = el("cards-sub");
    grid2.innerHTML = "";

    if(!list.length){
      sub.textContent = "No cards found yet.";
      var msg = document.createElement("div");
      msg.className = "cards-msg";
      msg.innerHTML = 'Add image files (PNG or JPG) to a folder named <code>cards</code> ' +
                      'in your repo, then tap Refresh. Filenames become the labels, so ' +
                      '<code>chest-and-back.png</code> shows up as "Chest And Back".';
      grid2.appendChild(msg);
      return;
    }

    sub.textContent = list.length + " card" + (list.length===1?"":"s") + " available.";

    var none = document.createElement("button");
    none.type = "button";
    none.className = "card-choice none-option" + (selectedCard ? "" : " selected");
    none.textContent = "No card";
    none.addEventListener("click", function(){
      setSelectedCard(null);
      finishCardPick();
    });
    grid2.appendChild(none);

    list.forEach(function(name){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card-choice" + (name === selectedCard ? " selected" : "");
      var im = document.createElement("img");
      im.src = cardUrl(name);
      im.alt = prettyName(name);
      im.loading = "lazy";
      var label = document.createElement("div");
      label.className = "cname";
      label.textContent = prettyName(name);
      btn.appendChild(im);
      btn.appendChild(label);
      btn.addEventListener("click", function(){
        setSelectedCard(name);
        finishCardPick();
      });
      grid2.appendChild(btn);
    });
  }

  function openCardPicker(force, returnScreen){
    cardPickerReturn = returnScreen || "screen-select";
    show("screen-cards");
    el("cards-sub").textContent = "Looking for cards\u2026";
    el("card-grid").innerHTML = "";
    discoverCards(!!force, function(list, source){
      renderCardGrid(list, source);
      focusFirst("screen-cards");
    });
  }

  function refreshCardOnlyView(){
    var wrap = el("cardonly-wrap");
    var empty = el("cardonly-empty");
    if(selectedCard){
      el("cardonly-img").src = cardUrl(selectedCard);
      el("cardonly-img").alt = prettyName(selectedCard);
      wrap.style.display = "";
      empty.style.display = "none";
    } else {
      wrap.style.display = "none";
      empty.style.display = "flex";
    }
  }

  function openCardOnly(){
    refreshCardOnlyView();
    show("screen-cardonly");
  }

  el("btn-pick-card").addEventListener("click", function(){ openCardPicker(false, "screen-select"); });
  el("btn-cards-back").addEventListener("click", function(){ show(cardPickerReturn); });
  el("btn-cards-refresh").addEventListener("click", function(){ openCardPicker(true, cardPickerReturn); });
  el("btn-cardonly-exit").addEventListener("click", function(){ show("screen-select"); });
  el("btn-cardonly-change").addEventListener("click", function(){ openCardPicker(false, "screen-cardonly"); });
  el("btn-cardonly-pick").addEventListener("click", function(){ openCardPicker(false, "screen-cardonly"); });
  el("btn-card-view").addEventListener("click", function(){
    document.body.classList.toggle("card-open");
  });

  // Restore last card choice on load
  (function(){
    var saved = null;
    if(store){ try{ saved = store.getItem("bell_selected_card"); }catch(e){} }
    if(saved) setSelectedCard(saved);
    // Warm the list in the background so the picker opens instantly
    discoverCards(false, function(){});
  })();

  /* ===================== TV REMOTE NAVIGATION ===================== */
  // Samsung/Tizen and several other TV browsers have unreliable built-in
  // spatial navigation and often suppress CSS focus outlines. So we run our
  // own: track a "cursor" element, move it geometrically with the D-pad,
  // and paint it with a class we control.

  var navCurrent = null;

  // Open the page with ?debug on the TV to see a running log of exactly
  // what the remote sends and what our nav logic decides to do about it.
  // Completely invisible/inert unless ?debug is in the URL.
  var DEBUG = location.search.indexOf("debug") !== -1;
  var dbgEl = null;
  if(DEBUG){
    dbgEl = document.createElement("div");
    dbgEl.style.cssText = "position:fixed;bottom:0;left:0;right:0;max-height:44vh;"+
      "overflow-y:auto;background:rgba(0,0,0,.92);color:#0f0;"+
      "font:14px/1.35 monospace;padding:6px 10px;z-index:99999;"+
      "white-space:pre-wrap;border-top:2px solid #0f0;";
    document.body.appendChild(dbgEl);
  }
  function describeNode(n){
    if(!n) return "none";
    var s = n.tagName ? n.tagName.toLowerCase() : String(n);
    if(n.id) s += "#"+n.id;
    if(n.className && typeof n.className === "string") s += "."+n.className.trim().split(/\s+/).join(".");
    var txt = (n.textContent||"").trim().replace(/\s+/g," ").slice(0,18);
    if(txt) s += " \""+txt+"\"";
    return s;
  }
  function dlog(msg){
    if(!DEBUG) return;
    var line = document.createElement("div");
    line.textContent = msg;
    dbgEl.insertBefore(line, dbgEl.firstChild);
    while(dbgEl.childNodes.length > 20) dbgEl.removeChild(dbgEl.lastChild);
  }

  function activeScreen(){ return document.querySelector(".screen.active"); }

  function collectNav(){
    var scr = activeScreen();
    if(!scr) return [];
    var nodes = [].slice.call(scr.querySelectorAll("button, input, select, textarea, a[href], [tabindex]"));
    return nodes.filter(function(n){
      if(n.disabled) return false;
      if(n.hasAttribute("hidden")) return false;
      var r = n.getBoundingClientRect();
      if(r.width <= 0 || r.height <= 0) return false;
      var st = window.getComputedStyle(n);
      if(st.visibility === "hidden" || st.display === "none" || st.opacity === "0") return false;
      return true;
    });
  }

  function paintNav(node){
    var prev = document.querySelectorAll(".nav-focus");
    for(var i=0;i<prev.length;i++) prev[i].classList.remove("nav-focus");
    if(!node) { navCurrent = null; return; }
    node.classList.add("nav-focus");
    navCurrent = node;
    try{ node.focus({ preventScroll:true }); }
    catch(e){ try{ node.focus(); }catch(e2){} }
    try{ node.scrollIntoView({ block:"nearest", inline:"nearest" }); }catch(e3){}
  }

  function centerOf(n){
    var r = n.getBoundingClientRect();
    return { x:r.left + r.width/2, y:r.top + r.height/2, r:r };
  }

  function moveNav(dir){
    var list = collectNav();
    if(!list.length) return;
    if(!navCurrent || list.indexOf(navCurrent) === -1){ paintNav(list[0]); return; }

    var c = centerOf(navCurrent);
    var best = null, bestScore = Infinity;

    for(var i=0;i<list.length;i++){
      var n = list[i];
      if(n === navCurrent) continue;
      var t = centerOf(n);
      var dx = t.x - c.x, dy = t.y - c.y;
      var along, across;
      if(dir === "left"){  if(dx > -6) continue; along = -dx; across = Math.abs(dy); }
      else if(dir === "right"){ if(dx < 6) continue; along = dx;  across = Math.abs(dy); }
      else if(dir === "up"){    if(dy > -6) continue; along = -dy; across = Math.abs(dx); }
      else { if(dy < 6) continue; along = dy;  across = Math.abs(dx); }
      // Weight sideways drift heavily so movement feels like a grid, not a scatter
      var score = along + across * 2.5;
      if(score < bestScore){ bestScore = score; best = n; }
    }
    if(best) paintNav(best);
  }

  function activateNav(){
    if(!navCurrent) return;
    if(navCurrent.tagName === "INPUT"){ try{ navCurrent.focus(); }catch(e){} return; }
    navCurrent.click();
  }

  function goBack(){
    if(el("screen-run").classList.contains("active")){ stopRun(); show("screen-select"); return true; }
    if(el("screen-config").classList.contains("active")){ show("screen-select"); return true; }
    if(el("screen-cards").classList.contains("active")){ show(cardPickerReturn); return true; }
    if(el("screen-cardonly").classList.contains("active")){ show("screen-select"); return true; }
    return false;
  }

  document.addEventListener("keydown", function(e){
    var k = e.key || "";
    var c = e.keyCode || e.which || 0;
    // What's actually receiving keystrokes (the on-screen keyboard types
    // into document.activeElement) — not just whatever the pointer last
    // highlighted, which can drift out of sync while a field is open.
    var activeEl = document.activeElement;
    var typing = !!(activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA"));
    var isBackspace = (k === "Backspace" || c === 8);

    // Back: Escape, Tizen (10009), webOS (461), generic browser back,
    // or Backspace — but only when we're not using it to delete a character.
    if(k === "Escape" || k === "BrowserBack" || k === "GoBack" ||
       c === 27 || c === 10009 || c === 461 || (isBackspace && !typing)){
      if(goBack()){ e.preventDefault(); }
      return;
    }
    if(isBackspace && typing) return; // let the field handle its own delete

    // Enter / OK
    if(k === "Enter" || c === 13){
      if(typing){ try{ activeEl.blur(); }catch(err){} e.preventDefault(); return; }
      e.preventDefault();
      activateNav();
      return;
    }

    // Arrows. Let left/right through while editing a number field.
    var dir = null;
    if(k === "ArrowLeft"  || c === 37) dir = "left";
    else if(k === "ArrowUp"    || c === 38) dir = "up";
    else if(k === "ArrowRight" || c === 39) dir = "right";
    else if(k === "ArrowDown"  || c === 40) dir = "down";
    if(dir){
      if(typing && (dir === "left" || dir === "right")) return;
      e.preventDefault();
      moveNav(dir);
    }
  }, true);

  // Samsung's pointer mode: keep the painted cursor in sync with hover
  // Samsung's remote in "pointer" mode moves an actual on-screen cursor a
  // few pixels per press, rather than firing arrow keys. So instead of
  // requiring the cursor to land exactly on a button, snap the highlight to
  // whatever's nearest once the pointer gets within reach.
  var MAGNET_RADIUS = 140;
  function nearestNavTo(x, y){
    var list = collectNav();
    var best = null, bestDist = Infinity;
    for(var i=0;i<list.length;i++){
      var r = list[i].getBoundingClientRect();
      var dx = Math.max(r.left - x, 0, x - r.right);
      var dy = Math.max(r.top - y, 0, y - r.bottom);
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < bestDist){ bestDist = dist; best = list[i]; }
    }
    return bestDist <= MAGNET_RADIUS ? best : null;
  }
  document.addEventListener("mousemove", function(e){
    var hit = nearestNavTo(e.clientX, e.clientY);
    if(hit && hit !== navCurrent){
      paintNav(hit);
      dlog("highlight -> " + describeNode(hit));
    }
  }, { passive:true });

  // The remote's OK button fires a real click at the raw pointer position,
  // which is often a few pixels off the button the magnet highlighted.
  // Make OK always activate whatever is actually highlighted.
  var dispatchingNavClick = false;
  document.addEventListener("click", function(e){
    dlog("click at "+Math.round(e.clientX)+","+Math.round(e.clientY)+
         "  target="+describeNode(e.target)+"  current="+describeNode(navCurrent));
    if(dispatchingNavClick){ dlog("  (redirected click passing through)"); return; }
    if(!navCurrent){ dlog("  (nothing highlighted yet, ignoring)"); return; }
    if(e.target === navCurrent || (navCurrent.contains && navCurrent.contains(e.target))){
      dlog("  (click landed on the highlighted item, letting it proceed)");
      return;
    }
    e.preventDefault();
    e.stopImmediatePropagation();
    dlog("  -> redirecting to " + describeNode(navCurrent));
    var target = navCurrent;
    setTimeout(function(){
      dispatchingNavClick = true;
      try{ target.click(); dlog("  -> dispatched click on " + describeNode(target)); }
      catch(err){ dlog("  !! click() threw: " + err); }
      dispatchingNavClick = false;
    }, 0);
  }, true);

  // Called by show() on every screen change
  function focusFirst(screenId){
    var pick;
    if(screenId === "screen-select")      pick = "#btn-pick-card";
    else if(screenId === "screen-config") pick = "#btn-start";
    else if(screenId === "screen-cards")  pick = "#card-grid .card-choice";
    else if(screenId === "screen-cardonly") pick = selectedCard ? "#btn-cardonly-exit" : "#btn-cardonly-pick";
    else if(screenId === "screen-run")    pick = "#btn-toggle";
    setTimeout(function(){
      var target = pick ? document.querySelector(pick) : null;
      if(!target){ var l = collectNav(); target = l.length ? l[0] : null; }
      paintNav(target);
    }, 80);
  }

  // Re-seat the cursor if the layout shifts (orientation change, card toggle)
  window.addEventListener("resize", function(){
    if(navCurrent && collectNav().indexOf(navCurrent) === -1){
      var l = collectNav();
      paintNav(l.length ? l[0] : null);
    }
  });

  focusFirst("screen-select");

})();
</script>
</body>
